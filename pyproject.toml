[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bifrost-valheim"
version = "0.1.0"
description = "Sincronización segura de mundos de Valheim mediante Cloudflare R2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["boto3>=1.43.102,<2", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
bifrost = "bifrost.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
